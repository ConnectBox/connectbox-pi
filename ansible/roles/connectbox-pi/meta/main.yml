---
dependencies:
  - bootstrap
  - { role: hat-service, when: not aws_instance }
  - { role: dns-dhcp, when: not aws_instance }
  - { role: network-interfaces, when: not aws_instance }
  - { role: wifi-ap, when: not aws_instance }
  - { role: mikegleasonjr.firewall, when: not aws_instance }
#  - { role: php, when: build_moodle}
  - { role: enhanced-content, when: enhanced_interface | bool }
  - nginx
  - { role: kiwix, when: enhanced_interface | bool }
  # HDMI screen: Raspberry Pi builds only (Kirk, 2026-11-11)
  - { role: hdmi-screen, when: connectbox_os == 'raspbian' and (enhanced_interface | bool) }
  - captive-portal
  - webserver-content
  - usb-content
  - { role: sample-content, when: not (enhanced_interface | bool) }
  - rpi-permissions
  - { role: wlan-set, when: not aws_instance }
  - remove-lz4

# ConnectBox "home" button for web content and ZIM (Kiwix) pages.
#
# Pages inside web content and ZIM files have no way back to the ConnectBox
# menu.  nginx adds a small floating house button just before </body> as each
# HTML page is served; the content itself is never changed.  It links to the
# ConnectBox home page, which opens in the visitor's selected language.
# target="_top" also escapes frames.  The icon is inline SVG so it does not
# depend on fonts or emoji; very old browsers without SVG show an empty but
# still tappable button.
#
# Needs the subs_filter module (Debian package libnginx-mod-http-subs-filter).
# Included from the /kiwix/ and web-content locations of connectbox_enhanced.conf.
subs_filter_types text/html;
subs_filter '</body>' '<a href="/" target="_top" title="Home" aria-label="Home" style="position:fixed;left:12px;bottom:12px;z-index:2147483647;display:block;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:22px;background:rgba(0,0,0,0.6);box-shadow:0 1px 4px rgba(0,0,0,0.4);text-decoration:none"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" style="position:absolute;left:10px;top:9px"><path fill="#ffffff" d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></a></body>' i;

---

- name: Install PxUSBm.py  
  copy: 
    src: usr_local_connectbox_bin_PxUSBm.py
    dest: /usr/local/connectbox/bin/PxUSBm.py
    mode: 0755

- name: Install urllib3
  pip:
    name: urllib3
    # Debian 12+ refuses system-wide pip installs unless told otherwise
    extra_args: "{{ '--break-system-packages' if python_externally_managed | default(false) else omit }}"


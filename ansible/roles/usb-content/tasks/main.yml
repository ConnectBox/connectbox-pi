---

# USB drives are mounted by PxUSBm.py (bootstrap role), not udev.  Remove the
# old automount rule from devices provisioned while udev also mounted USBs —
# having both react to every insert raced and stacked mounts.
- name: Remove retired USB automount udev rule
  file:
    path: /etc/udev/rules.d/99-usb-automount.rules
    state: absent
  notify:
    - Reload udev rules

- name: Create drop-in directory for systemd-udevd
  file:
    path: /etc/systemd/system/systemd-udevd.service.d
    state: directory

- name: Teach systemd-udev to expose mount points to the system
  copy:
    dest: /etc/systemd/system/systemd-udevd.service.d/mountflags.conf
    content: |
      [Service]
      MountFlags=shared
  notify:
    - Reload systemd-udevd unit file and restart service

- name: reload systemd-udevd unit
  command: udevadm trigger --action=change
  ignore_errors: yes
  
